apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: fyllut-sendinn-slack-alertmanager
  namespace: fyllut-sendinn
  labels:
    alertmanagerConfig: fyllut-sendinn-slack-alertmanager
    team: fyllut-sendinn
spec:
  receivers:
    - name: team-fyllut-sendinn-alerts
    - name: critical
      slackConfigs:
        - apiURL: &api_url
            key: apiUrl
            name: slack-webhook
          channel: &prod_channel '#team-fyllut-sendinn-alerts'
          iconEmoji: ':rotating-light:'
          username: 'Critical Errors'
          sendResolved: true
          title: &alert_title |-
            [{{ .Status | toUpper }}] : {{ .CommonLabels.alertname }}
          text: &alert_text >-
            {{ range .Alerts -}}
              {{ if and (eq .Status "firing")
                        (eq .Labels.severity "critical")
                        (ne .CommonLabels.special_type_to_use_in_alertmanager_config "fyllut-sendinn-alerts-dev") }}<!here> {{ end }}
              *Application:* {{.Labels.service}} {{ if .Labels.severity -}} `{{ .Labels.severity }}`{{- end }}{{"\n" -}}
              *Alert:* {{ .Annotations.title }}{{"\n" -}}
              {{- if eq .Status "firing" }}
              *Consequence:* {{ .Annotations.consequence }}{{"\n" -}}
              {{- if .Annotations.summary }}*Summary:* {{ .Annotations.summary }}{{"\n" -}}{{- end }}
              {{- if .Annotations.sla }}*Sla:* {{ .Annotations.sla }}{{"\n" -}}{{- end }}
              *Action:* <{{.Annotations.action}}|Check log>
              {{- end }}
            {{- end }}
          color: &alert_color |-
            {{ if eq .Status "firing" -}}
              {{ if eq .CommonLabels.severity "warning" -}}
                warning
              {{- else if eq .CommonLabels.severity "fatal" -}}
                #611f69
              {{- else if eq .CommonLabels.severity "critical" -}}
                #611f69
              {{- else if eq .CommonLabels.severity "danger" -}}
                danger
              {{- else if eq .CommonLabels.severity "error" -}}
                danger
              {{- else if eq .CommonLabels.severity "notice" -}}
                good
              {{- else if eq .CommonLabels.severity "info" -}}
                #36c5f0
              {{- else -}}
                .CommonLabels.severity
              {{- end -}}
            {{ else -}}
            good
            {{- end }}

    - name: non-critical
      slackConfigs:
        - apiURL: *api_url
          channel: *prod_channel
          iconEmoji: ':warning:'
          username: 'Non-critical Errors'
          sendResolved: true
          title: *alert_title
          text: *alert_text
          color: *alert_color

    - name: all-dev
      slackConfigs:
        - apiURL: *api_url
          channel: '#team-fyllut-sendinn-alerts-dev'
          iconEmoji: ':mag:'
          username: 'Dev Errors'
          sendResolved: true
          title: *alert_title
          text: *alert_text
          color: *alert_color
  route:
    groupInterval: 10s
    groupWait: 5s
    repeatInterval: 1h
    groupBy:
      - alertname
    receiver: team-fyllut-sendinn-alerts
    routes:
      - receiver: critical
        matchers:
          - name: "special_type_to_use_in_alertmanager_config"
            matchType: "="
            value: "fyllut-sendinn-alerts"
          - name: "severity"
            matchType: "="
            value: "critical"
      - receiver: non-critical
        matchers:
          - name: "special_type_to_use_in_alertmanager_config"
            matchType: "="
            value: "fyllut-sendinn-alerts"
          - name: "severity"
            matchType: "!="
            value: "critical"
      - receiver: all-dev
        matchers:
          - name: "special_type_to_use_in_alertmanager_config"
            matchType: "="
            value: "fyllut-sendinn-alerts-dev"
